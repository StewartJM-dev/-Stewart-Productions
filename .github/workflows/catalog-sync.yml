name: Sync public music catalog

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-sync.yml
      - scripts/sync_catalog.py
      - scripts/browse_catalog.py

permissions:
  contents: write
  pages: write

concurrency:
  group: stewart-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check Audiomack, Suno, and YouTube
        run: python3 scripts/sync_catalog.py --home index.html > "$RUNNER_TEMP/catalog-plan.json"
      - name: Add verified releases
        id: apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "catalog-plan.json").read_text())
          print("Observed:", plan["observed"])
          print("Added:", plan["added"])
          for warning in plan["warnings"]:
              print(f"::warning::{warning}")
          changes = plan["changes"]
          catalog_indexes = {"index.html", "albums/index.html", "singles/index.html", "videos/index.html", "data/browse.json"}
          for name in changes:
              if name not in catalog_indexes and (
                  not re.fullmatch(r"(albums|singles|videos)/[a-zA-Z0-9_-]+/index\.html", name)
                  or Path(name).exists()
              ):
                  raise ValueError(f"Unexpected catalog edit: {name}")
          for name, html in changes.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(html, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"added={'true' if changes else 'false'}\n")
          PY
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- index.html albums singles videos data
            git commit -m "Sync new public music releases"
            git push origin HEAD:main
          fi
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED_RELEASES: ${{ steps.apply.outputs.added }}
        run: |
          if [ "$ADDED_RELEASES" = true ] || [ "$GITHUB_EVENT_NAME" = push ] ||
             ! curl -fsSL --max-time 15 'https://stewartjm-dev.github.io/-Stewart-Productions/?catalog-check' | cmp -s index.html -; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          else
            echo "The live catalog is already current."
          fi
