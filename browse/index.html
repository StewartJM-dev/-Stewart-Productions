<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#164632">
  <title>Search &amp; Genres | Stewart Productions</title>
  <link rel="icon" href="../assets/stewart-badge.webp">
  <link rel="stylesheet" href="../assets/catalog.css?v=browse1">
  <script src="../assets/browse.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark brand" href="../">
        <img src="../assets/stewart-badge.webp" alt="" width="44" height="44">
        <span>Stewart Productions</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="../">Home</a>
        <a href="../albums/">Albums</a>
        <a href="../singles/">Singles</a>
        <a href="../videos/">Videos</a>
        <a href="../about/">About</a>
        <a href="../browse/" aria-current="page">Search &amp; Genres</a>
      </nav>
    </div>
  </header>

  <main class="wrap browse-page" id="main">
    <h1>Search &amp; Genres</h1>
    <form id="search-form" action="./">
      <label for="search-query">Search music and videos</label>
      <div class="search-controls">
        <input id="search-query" name="q" type="search" placeholder="Try a song or album title">
        <button type="submit">Search</button>
      </div>
    </form>
    <section aria-labelledby="filter-title">
      <h2 id="filter-title">Browse by genre or theme</h2>
      <div class="genre-filters" id="genre-filters" role="group" aria-labelledby="filter-title"></div>
    </section>
    <p id="browse-status" role="status">Loading catalog…</p>
    <ul class="browse-results" id="browse-results"></ul>
    <noscript><p>Enable JavaScript to search. You can also use the Albums, Singles, and Videos links above.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Stewart Productions</span>
      <nav aria-label="Music platforms">
        <a href="https://audiomack.com/stewartjm">Audiomack</a>
        <a href="https://suno.com/@stewartjm">Suno</a>
        <a href="https://www.youtube.com/@stewartproductions1982">YouTube</a>
      </nav>
    </div>
  </footer>
</body>
</html>
